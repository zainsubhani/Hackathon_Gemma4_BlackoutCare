services:
  postgres:
    image: ankane/pgvector
    container_name: blackoutcare-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: blackoutcare
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - blackoutcare-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blackoutcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    container_name: blackoutcare-ollama
    profiles: ["docker-ollama"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - blackoutcare-ollama-data:/root/.ollama

  ollama-model:
    image: ollama/ollama
    profiles: ["docker-ollama"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "gemma:7b"]
    depends_on:
      ollama:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: blackoutcare-backend
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/blackoutcare
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      PASSWORD_RESET_MASTER_PASSWORD: ${PASSWORD_RESET_MASTER_PASSWORD:?Set PASSWORD_RESET_MASTER_PASSWORD in .env}
      BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN:?Set BOOTSTRAP_ADMIN_TOKEN in .env}
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      OLLAMA_MODEL: gemma:7b
      OLLAMA_TIMEOUT_SECONDS: 240
      AI_ANALYSIS_TIMEOUT_SECONDS: 240
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: blackoutcare-frontend
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - blackoutcare-frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  blackoutcare-postgres-data:
  blackoutcare-ollama-data:
  blackoutcare-frontend-node-modules:
